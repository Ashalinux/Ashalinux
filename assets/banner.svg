<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <style>
    .bg { fill: #F0EEE6; }
    .name { font: 700 92px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #3D3929; letter-spacing: -2px; }
    .accent { fill: #D97757; }
    .sub { font: 400 30px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #6B6455; }
    .reveal { opacity: 0; animation: up 1s cubic-bezier(.2,.7,.2,1) forwards; }
    .d1 { animation-delay: .1s; } .d2 { animation-delay: .5s; } .d3 { animation-delay: .9s; }
    @keyframes up { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
    .spin { transform-origin: 0 0; animation: spin 14s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .pulse { animation: pulse 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 0%,100% { opacity: .25; transform: scale(.8); } 50% { opacity: .9; transform: scale(1.15); } }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .float { animation: float 6s ease-in-out infinite; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  </style>

  <rect class="bg" width="1200" height="320" rx="24"/>

  <!-- soft glow -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#D97757" stop-opacity=".22"/>
      <stop offset="1" stop-color="#D97757" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="1010" cy="160" r="190" fill="url(#glow)"/>

  <!-- text, left aligned -->
  <g transform="translate(72 0)">
    <text class="name reveal d1" x="0" y="150">Ashalinux<tspan class="accent">.</tspan></text>
    <text class="sub reveal d2" x="4" y="205">Minecraft plugin developer · building with Claude</text>
    <g class="reveal d3">
      <text class="sub" x="4" y="252" style="font-size:24px;fill:#D97757;font-family:Consolas,'Fira Code',monospace">&gt; java · skript · linux · self-hosting</text>
      <rect class="cursor" x="518" y="232" width="13" height="26" fill="#D97757"/>
    </g>
  </g>

  <!-- rotating spark -->
  <g transform="translate(1010 160)">
    <g class="float">
      <g class="spin" fill="#D97757">
        <rect x="-11" y="-78" width="22" height="156" rx="11"/>
        <rect x="-11" y="-78" width="22" height="156" rx="11" transform="rotate(60)"/>
        <rect x="-11" y="-78" width="22" height="156" rx="11" transform="rotate(120)"/>
      </g>
    </g>
  </g>

  <!-- twinkling dots -->
  <circle class="pulse" cx="880" cy="70"  r="6" fill="#D97757"/>
  <circle class="pulse" cx="1135" cy="88" r="4" fill="#3D3929" style="animation-delay:.8s"/>
  <circle class="pulse" cx="905" cy="262" r="5" fill="#3D3929" style="animation-delay:1.6s"/>
  <circle class="pulse" cx="1120" cy="250" r="7" fill="#D97757" style="animation-delay:2.2s"/>
</svg>
